[project]
name = "acsa-gateway"
version = "0.1.0"
description = "Merchant-controlled safety gateway for AI-assisted checkout"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "anyio>=4.10,<4.15",
  "cryptography>=45,<48",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "http-message-signatures==2.0.1",
  "inngest>=0.5,<1",
  "orjson>=3.10,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acsa"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires local PostgreSQL or another explicitly configured test database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["acsa"]

[tool.vercel]
entrypoint = "app:app"
